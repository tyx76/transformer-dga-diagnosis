  <rect width="2100" height="1580" rx="28" fill="#F6F8FB"/>
  <rect x="0" y="0" width="2100" height="112" rx="28" fill="#0F172A"/>
  <rect x="0" y="84" width="2100" height="28" fill="#0F172A"/>
  <rect x="66" y="32" width="8" height="52" rx="4" fill="#22D3EE"/>
  <text x="92" y="59" class="title" fill="#FFFFFF">油浸式电力变压器 DGA 故障根因分析智能体</text>
  <text x="92" y="88" class="subtitle" fill="#CBD5E1">当前工作区架构 · 意图路由 → hybrid + pure_kb → RRF → DeepSeek → 引用校验</text>
  <rect x="1690" y="34" width="330" height="44" rx="22" fill="#1E293B" stroke="#334155"/>
  <text x="1855" y="62" text-anchor="middle" class="tag" fill="#A5F3FC">CURRENT CODE · 2026-09-18</text>

  <!-- offline layer -->
  <rect x="45" y="140" width="2010" height="370" rx="22" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2" filter="url(#shadow)"/>
  <rect x="45" y="140" width="12" height="370" rx="6" fill="#2563EB"/>
  <text x="80" y="181" class="section">离线知识构建与索引层</text>
  <text x="80" y="207" class="small">两条知识后端并存：旧 hybrid 后端负责向量 + BM25；pure_kb 后端负责六领域显式过滤检索。</text>

  <!-- legacy backend -->
  <rect x="80" y="226" width="875" height="250" rx="18" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="2"/>
  <rect x="102" y="242" width="255" height="30" rx="15" fill="#DBEAFE"/>
  <text x="229" y="263" text-anchor="middle" class="tag" fill="#1D4ED8">A. 旧 hybrid 后端</text>

  <rect x="106" y="286" width="230" height="160" rx="14" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="128" y="317" class="box-title">规程原始资产</text>
  <text x="128" y="347" class="mono-small">DL/T 722-2014</text>
  <text x="128" y="373" class="small">5 块判据 / 表格</text>
  <text x="128" y="401" class="mono-small">DL/T 572-2021</text>
  <text x="128" y="427" class="small">118 条运行维护条款</text>

  <path d="M336 366 H378" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <rect x="386" y="286" width="220" height="160" rx="14" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
  <text x="407" y="317" class="box-title">统一语料</text>
  <text x="407" y="347" class="mono-small">build_unified_corpus.py</text>
  <text x="407" y="374" class="small">合并、去重、字段校验</text>
  <text x="407" y="402" class="mono-small">clauses.jsonl</text>
  <text x="407" y="427" class="small">123 块 · 本地生成</text>

  <path d="M606 338 C630 338 628 315 650 315" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M606 396 C630 396 628 430 650 430" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="656" y="270" width="270" height="90" rx="14" fill="#F0FDF4" stroke="#4ADE80" stroke-width="2"/>
