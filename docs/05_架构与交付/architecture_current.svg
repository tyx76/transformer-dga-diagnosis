  <text x="677" y="328" class="mono-small">bm25_index.pkl</text>
  <text x="677" y="348" class="small">jieba + BM25Okapi · 自动重建</text>

  <rect x="656" y="390" width="270" height="90" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="677" y="420" class="box-title">SQLite 向量库</text>
  <text x="677" y="448" class="mono-small">vector_kb/knowledge.db</text>
  <text x="677" y="468" class="small">123 块 · bge-m3 · 1024 维</text>

  <!-- pure backend -->
  <rect x="985" y="226" width="1035" height="250" rx="18" fill="#F8FAFC" stroke="#C4B5FD" stroke-width="2"/>
  <rect x="1008" y="242" width="265" height="30" rx="15" fill="#EDE9FE"/>
  <text x="1140" y="263" text-anchor="middle" class="tag" fill="#6D28D9">B. pure_kb 新后端</text>

  <rect x="1012" y="286" width="292" height="160" rx="14" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2"/>
  <text x="1034" y="317" class="box-title">六领域知识 JSONL</text>
  <text x="1034" y="344" class="mono-small">pure_kb/data/knowledge.jsonl</text>
  <text x="1034" y="371" class="small">dga 41 · oil_temp 61 · safety 26</text>
  <text x="1034" y="397" class="small">equipment 10 · dp 39 · cases 21</text>
  <text x="1034" y="425" class="box-subtitle">合计 198 条</text>

  <path d="M1304 366 H1332" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <rect x="1340" y="286" width="230" height="160" rx="14" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="1361" y="317" class="box-title">构建纯知识库</text>
  <text x="1361" y="347" class="mono-small">pure_kb/build_db.py</text>
  <text x="1361" y="375" class="small">逐域入库 + 向量化</text>
  <text x="1361" y="403" class="mono-small">Ollama bge-m3:latest</text>
  <text x="1361" y="429" class="small">1024 维 · L2 归一化</text>

  <path d="M1570 366 H1608" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <rect x="1616" y="286" width="278" height="160" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="1638" y="317" class="box-title">SQLite 纯知识库</text>
  <text x="1638" y="347" class="mono-small">pure_kb/knowledge.db</text>
  <text x="1638" y="375" class="small">domain + doc_id + clause</text>
  <text x="1638" y="403" class="small">显式 domains / filters 检索</text>
  <text x="1638" y="429" class="small">dp 域仅存储，不进入生成链</text>

  <rect x="1920" y="286" width="72" height="160" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="6 5"/>
  <text x="1956" y="326" text-anchor="middle" class="box-subtitle" writing-mode="vertical-rl">未提交本地数据库</text>

  <!-- online layer -->
  <rect x="45" y="535" width="2010" height="750" rx="22" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2" filter="url(#shadow)"/>
  <rect x="45" y="535" width="12" height="750" rx="6" fill="#7C3AED"/>
  <text x="80" y="577" class="section">在线问答主链路</text>
  <text x="80" y="603" class="small">默认 USE_ROUTER=true：意图识别与路由后，hybrid 与 pure_kb 依次召回，再合并为最终 Top-5。</text>
  <rect x="1660" y="556" width="350" height="34" rx="17" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="1835" y="578" text-anchor="middle" class="tag" fill="#6D28D9">main.py ask() · 当前正式入口</text>

  <!-- row 1 -->
  <rect x="80" y="650" width="210" height="115" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="104" y="684" class="box-title">用户问题</text>
  <text x="104" y="714" class="small">单次问答 / 交互模式</text>
  <text x="104" y="742" class="mono-small">main.py --debug</text>

  <path d="M290 708 H316" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="324" y="650" width="220" height="115" rx="16" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
  <text x="348" y="684" class="box-title">检索入口选择</text>
  <text x="348" y="714" class="mono-small">USE_ROUTER=true</text>
  <text x="348" y="742" class="small">false 时回退纯 hybrid</text>

  <path d="M544 708 H572" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <rect x="580" y="620" width="330" height="175" rx="18" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2"/>
  <text x="606" y="652" class="box-title">意图识别与路由</text>
  <rect x="604" y="668" width="132" height="100" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="620" y="694" class="box-subtitle">classify_intent()</text>
  <text x="620" y="718" class="small">规则优先</text>
  <text x="620" y="741" class="small">DeepSeek 兜底</text>
  <text x="620" y="760" class="small">支持 multi</text>
  <rect x="752" y="668" width="132" height="100" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="768" y="694" class="box-subtitle">route_intent()</text>
  <text x="768" y="718" class="small">domains</text>
  <text x="768" y="741" class="small">filters</text>
  <text x="768" y="760" class="small">search / exact / refuse</text>
  <text x="606" y="788" class="tiny">规则文件：data/rules/intent_rules.json</text>

  <path d="M910 685 H968" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M910 735 C928 735 930 805 968 805" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <!-- retrieval -->
  <rect x="945" y="605" width="575" height="280" rx="18" fill="#F8FAFC" stroke="#C4B5FD" stroke-width="2"/>
  <text x="970" y="635" class="box-title">retrieval_router.route_and_retrieve()</text>
  <text x="970" y="657" class="tiny">hybrid → pure_kb 依次候选 Top-20，最终仅保留 Top-5</text>

  <rect x="972" y="672" width="246" height="84" rx="13" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
  <text x="993" y="700" class="box-subtitle">hybrid_retrieve()</text>
  <text x="993" y="725" class="small">向量 + BM25 → RRF</text>
  <text x="993" y="746" class="tiny">Ollama bge-m3 · cosine ≥ 0.45</text>

  <rect x="972" y="780" width="246" height="84" rx="13" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="993" y="808" class="box-subtitle">search_knowledge_base()</text>
  <text x="993" y="833" class="small">pure_kb.search(domains, filters)</text>
  <text x="993" y="854" class="tiny">适配器过滤 dp · 归一化 · 去重</text>

  <path d="M1218 714 C1238 714 1240 742 1258 748" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M1218 822 C1238 822 1240 775 1258 770" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <rect x="1266" y="705" width="226" height="108" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="1288" y="735" class="box-title">RRF 合并</text>
  <text x="1288" y="762" class="small">merge_with_hybrid()</text>
  <text x="1288" y="787" class="small">k=60 · doc_id + clause 去重</text>
  <text x="1288" y="808" class="tiny">任一路为空则取非空 Top-5</text>

  <path d="M434 765 V820 H930 V714 H968" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
  <text x="608" y="806" class="arrow">USE_ROUTER=false 回退</text>

  <path d="M1379 741 H1480 V707 H1548" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <!-- intent refusal -->
  <path d="M745 795 V892" stroke="#E11D48" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>
  <text x="757" y="850" class="arrow">irrelevant / refuse / domains 为空</text>
  <rect x="580" y="900" width="330" height="104" rx="16" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/>
  <text x="606" y="933" class="box-title">直接拒答</text>
  <text x="606" y="962" class="small">“资料未覆盖，无法回答”</text>
  <text x="606" y="987" class="small">意图无关时不检索；无候选时生成前停止</text>

  <!-- generation -->
  <rect x="1556" y="650" width="205" height="115" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="1577" y="683" class="box-title">生成答案</text>
  <text x="1577" y="711" class="mono-small">generation.generate()</text>
  <text x="1577" y="736" class="small">DeepSeek deepseek-chat</text>
  <text x="1577" y="758" class="small">T=0.1 · max_tokens=800</text>

  <path d="M1761 708 H1788" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <rect x="1796" y="635" width="220" height="146" rx="16" fill="#FFF1F2" stroke="#FB7185" stroke-width="2"/>
  <text x="1818" y="669" class="box-title">引用校验</text>
  <text x="1818" y="698" class="mono-small">verify_citations()</text>
  <text x="1818" y="726" class="small">引用必须来自本次 Top-5</text>
  <text x="1818" y="751" class="small">校验 doc_id + clause</text>
  <text x="1818" y="773" class="small">失败进入重写</text>

  <path d="M1906 781 V892" stroke="#16A34A" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="1918" y="845" class="arrow">引用有效</text>
  <rect x="1796" y="900" width="220" height="100" rx="16" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="1818" y="932" class="box-title">最终输出</text>
  <text x="1818" y="961" class="small">带【依据：doc_id 第clause条】</text>
  <text x="1818" y="985" class="small">根因分析与处置建议</text>

  <path d="M1796 746 H1770 V925 H1765" fill="none" stroke="#E11D48" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>
  <text x="1704" y="824" class="arrow">引用无效</text>
  <rect x="1546" y="882" width="220" height="118" rx="16" fill="#FFF1F2" stroke="#FB7185" stroke-width="2"/>
  <text x="1568" y="914" class="box-title">纠错重写</text>
  <text x="1568" y="943" class="small">build_retry_prompt()</text>
  <text x="1568" y="968" class="small">初次 + 最多重写 2 次</text>
  <text x="1568" y="991" class="tiny">仍无效：删除无依据句，空则拒答</text>
  <path d="M1656 882 V770" stroke="#E11D48" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>
  <text x="1668" y="833" class="arrow">重新生成</text>

  <path d="M1379 807 V862 H745 V892" fill="none" stroke="#E11D48" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>
  <text x="1202" y="850" class="arrow">无候选结果</text>

  <!-- bottom layer -->
  <rect x="45" y="1310" width="2010" height="230" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="45" y="1310" width="12" height="230" rx="6" fill="#F59E0B"/>

  <rect x="78" y="1342" width="900" height="165" rx="18" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="2"/>
  <text x="104" y="1375" class="box-title">可观测性与评测</text>
  <rect x="104" y="1395" width="268" height="88" rx="12" fill="#FFFFFF" stroke="#BAE6FD"/>
  <text x="124" y="1422" class="box-subtitle">--debug 轨迹</text>
  <text x="124" y="1448" class="tiny">意图识别 → 路由 → 向量/BM25</text>
  <text x="124" y="1468" class="tiny">hybrid/KB Top-K → RRF → 引用校验</text>
  <rect x="392" y="1395" width="272" height="88" rx="12" fill="#FFFFFF" stroke="#BAE6FD"/>
  <text x="412" y="1422" class="box-subtitle">验收用例集</text>
  <text x="412" y="1448" class="mono-small">acceptance_cases.jsonl</text>
  <text x="412" y="1470" class="small">50 条 · 检索 / 引用 / 拒答评测</text>
  <rect x="684" y="1395" width="270" height="88" rx="12" fill="#FFFFFF" stroke="#BAE6FD"/>
  <text x="704" y="1422" class="box-subtitle">A/B 与回归</text>
  <text x="704" y="1448" class="mono-small">shadow_ab_test.py</text>
  <text x="704" y="1470" class="small">run_regression.py · 影子对比报告</text>

  <rect x="1002" y="1342" width="1020" height="165" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="1028" y="1375" class="box-title">判定边界、失败路径与未接入主链资产</text>
  <text x="1028" y="1406" class="small">证据边界：只允许引用本次实际检索结果；无候选在生成前拒答。</text>
  <text x="1028" y="1432" class="small">领域边界：pure_kb 的 dp 域由 adapter 丢弃；六领域中仅业务域进入生成。</text>
  <text x="1028" y="1458" class="small">安全边界：处置建议保留人工复核；危险性操作须落在 GB 26860-2011 边界内。</text>
  <text x="1028" y="1487" class="small">旁路资产：vector_kb/cli.py 纯向量链路、scripts/dga_ratio.py 规则基线，不替代 main.py。</text>

  <text x="78" y="1568" class="small">依据当前代码：main.py · retrieval_router.py · intent_classifier.py · intent_router.py · knowledge_base_adapter.py · pure_kb/* · generation.py · citation_verifier.py</text>
</svg>