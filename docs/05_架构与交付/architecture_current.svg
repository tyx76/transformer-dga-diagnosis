<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1580" viewBox="0 0 2100 1580" role="img" aria-labelledby="title desc">
  <title id="title">油浸式电力变压器 DGA 故障根因分析智能体最新架构图</title>
  <desc id="desc">依据当前工作区代码绘制，包含离线知识构建、意图识别与路由、hybrid 与 pure_kb 双后端检索、RRF 合并、DeepSeek 生成、引用校验以及拒答重试路径。</desc>
